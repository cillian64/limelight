[package]
edition = "2021"
name = "limelight"
version = "0.1.0"

[dependencies]
cortex-m = "0.7.2"
cortex-m-rt = "0.7"
cortex-m-rtic = "1.1.4"
critical-section = {version = "1.2.0"}
defmt = "0.3"
defmt-rtt = "0.4.0"
embedded-alloc = "0.5.1"
embedded-hal = "1.0.0"
embedded-io = "0.6.1"
embedded_hal_0_2 = {package = "embedded-hal", version = "0.2.5", features = ["unproven"]}
panic-halt = "0.2.0"
rp235x-hal = {version = "0.2.0", features = ["binary-info", "critical-section-impl", "rt", "defmt"]}

dmg1083 = {path = "../eta/dmg1083"}
dmg1083-software-rp235x = {path = "../dmg1083-software-rp235x"}
mbi5153 = {path = "../eta/mbi5153"}
misc-hacks = {path = "../eta/misc-hacks"}

embedded-graphics = "0.8.1"
